name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first — no point finishing a run for a commit
# that is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exactly what Vercel does, with no environment variables set. This is the
  # check that would have caught the deploy that 404'd on every path: it
  # asserts the build produces real routes, not just that it exits zero.
  build:
    name: Build (as Vercel does, no env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: The build must produce actual routes
        run: |
          test -f .next/routes-manifest.json || { echo "no routes manifest"; exit 1; }
          pages=$(node -e "
            const m = require('./.next/routes-manifest.json');
            const all = [...m.staticRoutes, ...m.dynamicRoutes]
              .map(r => r.page)
              .filter(p => !p.startsWith('/_') && p !== '/404' && p !== '/500');
            console.log(all.length);
            console.error(all.sort().join('\n'));
          ")
          echo "routes: $pages"
          if [ "$pages" -lt 10 ]; then
            echo "::error::Only $pages routes — the app would 404. Did a page.tsx go missing?"
            exit 1
          fi

  # Signs up, onboards, verifies, posts, bids, hires and messages, in a real
  # browser against a real Postgres. Unit tests kept passing while the product
  # was unusable; this is the check that does not.
  walk:
    name: Walk the product end to end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: felicek
          POSTGRES_PASSWORD: felicek
          POSTGRES_DB: felicek
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://felicek:felicek@localhost:5432/felicek
      DIRECT_URL: postgresql://felicek:felicek@localhost:5432/felicek
      AUTH_SECRET: ci-only-secret-that-is-long-enough-to-sign-with
      BASE: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma db push --skip-generate

      # prisma/init.sql is what people paste into a hosting provider's SQL
      # editor when they have no local Node setup. If it drifts from
      # schema.prisma, they get a database that is missing columns the code
      # reads — which shows up as "Something broke" on whichever page happens
      # to read one first. That already happened once.
      - name: prisma/init.sql must match the schema
        run: |
          npx prisma migrate diff --from-empty \
            --to-schema-datamodel prisma/schema.prisma --script > /tmp/expected.sql
          # Compare statements only; init.sql carries an explanatory header.
          norm() { grep -vE '^\s*(--|$)' "$1" | tr -s ' '; }
          if ! diff <(norm /tmp/expected.sql) <(norm prisma/init.sql) > /tmp/sql.diff; then
            echo "::error::prisma/init.sql is out of date. Regenerate it:"
            echo "  npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script"
            cat /tmp/sql.diff
            exit 1
          fi

      # An existing deployment upgrades with upgrade.sql rather than init.sql.
      # Applying it on top of a database built from init.sql must leave the two
      # indistinguishable, or an upgraded site differs from a fresh one in ways
      # nobody will notice until a query fails.
      - name: prisma/upgrade.sql must be idempotent and reach the same schema
        env:
          PGPASSWORD: felicek
        run: |
          psql -h localhost -U felicek -d felicek -q -v ON_ERROR_STOP=1 \
            -f prisma/upgrade.sql
          psql -h localhost -U felicek -d felicek -q -v ON_ERROR_STOP=1 \
            -f prisma/upgrade.sql
          echo "upgrade.sql applied twice with no error"

      # The seed is part of the product surface: it must keep matching the
      # schema, and its skills must stay inside the taxonomy or the jobs it
      # creates match nobody. It validates both and exits non-zero if not.
      - run: npm run db:seed

      - run: npm run build
      - name: Start the production server
        run: |
          npm start &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000 && exit 0
            sleep 2
          done
          echo "::error::The server never came up"
          exit 1
      - run: npm run test:e2e
